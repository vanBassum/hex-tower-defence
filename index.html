<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hex Tactics</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="game/ui/card_bar.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

    /* Corner legend. Alt+drag is the one binding nobody guesses, so the camera
       needs to say so somewhere. Held at low opacity and lifted on hover: it is
       a reminder for the first minute, not part of the picture after that.
       It takes the pointer rather than passing it through, which costs the few
       hexes of sea behind it - the alternative is `pointer-events: none`, and an
       element that ignores the pointer never receives :hover either. */
    #controls {
      position: fixed;
      left: 16px; bottom: 16px;
      display: grid;
      grid-template-columns: auto auto;
      gap: 5px 12px;
      align-items: center;
      padding: 11px 14px;
      border-radius: 7px;
      background: rgba(9, 16, 30, 0.55);
      border: 1px solid rgba(143, 216, 232, 0.14);
      color: #b9cfe0;
      font-size: 12px;
      line-height: 1;
      opacity: 0.4;
      transition: opacity 220ms ease;
      user-select: none;
      cursor: default;
    }
    #controls:hover { opacity: 1; }
    #controls kbd {
      justify-self: end;
      font: inherit;
      color: #dcecf6;
      white-space: nowrap;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
    }

    /* Something on screen while the island is built and the shaders are compiled.
       It is a word rather than a progress bar on purpose: there is nothing being
       fetched to measure, only a couple of seconds of work with no honest
       fractions in it, and a bar that jumps from nothing to done is a lie about
       what is happening. What it has to say is only that the page has not died.

       It is in the HTML rather than made by main.js because the point of it is to
       be there *before* main.js runs. */
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: #b9cfe0;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: opacity 320ms ease;
      z-index: 10;
    }
    #loading.is-done { opacity: 0; pointer-events: none; }
    #loading span { animation: loading-pulse 1.6s ease-in-out infinite; }

    @keyframes loading-pulse {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.9; }
    }

  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading"><span>Making an island</span></div>
  <div id="controls">
    <kbd>Left-click</kbd><span>Select / deselect</span>
    <kbd>Right-click</kbd><span>Walk there</span>
    <kbd>Right-drag</kbd><span>Rotate</span>
    <kbd>Middle-drag</kbd><span>Pan</span>
    <kbd>Wheel</kbd><span>Zoom</span>
    <kbd>Q / E</kbd><span>Turn a hex face</span>
  </div>
  <div id="hand" class="is-empty"></div>
  <script type="module" src="game/main.js"></script>
</body>
</html>
