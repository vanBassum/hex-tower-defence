<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hex Tactics - Editor</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

    /* Two panels in the same key as the game's corner legend - the editor is the
       same world with a different question asked of it, so it should not arrive
       in a different visual language. */
    #panel, #controls {
      position: fixed;
      padding: 11px 14px;
      border-radius: 7px;
      background: rgba(9, 16, 30, 0.55);
      border: 1px solid rgba(143, 216, 232, 0.14);
      color: #b9cfe0;
      font-size: 12px;
      line-height: 1;
      user-select: none;
      cursor: default;
    }

    /* Top right, and at full opacity: this one is a readout that is being read,
       not a reminder that fades out of the picture after the first minute. */
    #panel { right: 16px; top: 16px; min-width: 190px; }
    #panel .rows {
      display: grid;
      grid-template-columns: auto auto;
      gap: 5px 12px;
      align-items: center;
    }
    #panel .k { color: #7f93a4; }
    #panel .v { justify-self: end; color: #dcecf6; font-variant-numeric: tabular-nums; }

    /* The name of the level being edited, and the one thing in the panel that is
       an input rather than a readout - so it is the same grid row as everything
       else and looks like a field you can type in. */
    #panel .name {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 5px 12px;
      align-items: center;
      margin-bottom: 8px;
    }
    #panel .name input {
      width: 100%;
      font: inherit;
      color: #f0dcc0;
      text-align: right;
      padding: 5px 7px;
      border-radius: 4px;
      background: rgba(8, 12, 20, 0.55);
      border: 1px solid rgba(143, 216, 232, 0.18);
    }
    #panel .name input:focus { outline: none; border-color: rgba(143, 216, 232, 0.45); }

    /* A rule above the first bar: the rows are what the level *is* and the bars
       are what can be done to it, and the two should not read as one list. */
    #panel .bar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    #panel .bar:first-of-type {
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid rgba(143, 216, 232, 0.14);
    }
    /* Moving a level in or out of the browser is the secondary way to work now -
       held back rather than hidden, and lifted when it is reached for. */
    #panel .bar.is-secondary { opacity: 0.55; }
    #panel .bar.is-secondary:hover { opacity: 1; }

    #panel button, #panel select {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: #dcecf6;
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
      cursor: pointer;
      transition: background 160ms ease;
    }
    #panel button:hover:not(:disabled), #panel select:hover { background: rgba(143, 216, 232, 0.20); }
    #panel button:disabled, #panel select:disabled { opacity: 0.35; cursor: default; }
    /* A dark dropdown draws its own list in the platform's colours; the option
       colour is the one part of it worth stating so the list is not black text on
       a black field on some machines. */
    #panel select option { color: #16202f; background: #dcecf6; }

    /* Empty until something has happened, and it collapses when it is - a status
       line reserving space for a message nobody has been given yet is a gap in
       the panel. */
    #panel .status {
      color: #7f93a4;
      line-height: 1.4;
      max-width: 220px;
      user-select: text;
    }
    #panel .status:not(:empty) { margin-top: 9px; }
    #panel .status.is-error { color: #e08a7a; }

    #controls {
      left: 16px; bottom: 16px;
      display: grid;
      grid-template-columns: auto auto;
      gap: 5px 12px;
      align-items: center;
      opacity: 0.4;
      transition: opacity 220ms ease;
    }
    #controls:hover { opacity: 1; }
    #controls kbd {
      justify-self: end;
      font: inherit;
      color: #dcecf6;
      white-space: nowrap;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="panel"></div>
  <div id="controls">
    <kbd>Left-click</kbd><span>Select a hex</span>
    <kbd>Right-drag</kbd><span>Rotate</span>
    <kbd>Middle-drag</kbd><span>Pan</span>
    <kbd>Wheel</kbd><span>Zoom</span>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
