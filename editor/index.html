<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hex Tactics - Editor</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

    /* Two panels in the same key as the game's corner legend - the editor is the
       same world with a different question asked of it, so it should not arrive
       in a different visual language. */
    #panel, #controls {
      position: fixed;
      padding: 11px 14px;
      border-radius: 7px;
      background: rgba(9, 16, 30, 0.55);
      border: 1px solid rgba(143, 216, 232, 0.14);
      color: #b9cfe0;
      font-size: 12px;
      line-height: 1;
      user-select: none;
      cursor: default;
    }

    /* Top right, and at full opacity: this one is a readout that is being read,
       not a reminder that fades out of the picture after the first minute. */
    #panel { right: 16px; top: 16px; min-width: 190px; }
    #panel .rows {
      display: grid;
      grid-template-columns: auto auto;
      gap: 5px 12px;
      align-items: center;
    }
    #panel .k { color: #7f93a4; }
    #panel .v { justify-self: end; color: #dcecf6; font-variant-numeric: tabular-nums; }

    /* A rule above the button: the rows are what the level *is* and the button
       is everything that can be done to it, which now lives behind the one
       word. */
    #panel .bar {
      display: flex;
      gap: 8px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid rgba(143, 216, 232, 0.14);
    }
    #panel button {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: #dcecf6;
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
      cursor: pointer;
      transition: background 160ms ease;
    }
    #panel button:hover { background: rgba(143, 216, 232, 0.20); }

    /* Empty until something has happened, and it collapses when it is - a status
       line reserving space for a message nobody has been given yet is a gap in
       the panel. */
    #panel .status {
      color: #7f93a4;
      line-height: 1.4;
      max-width: 220px;
      user-select: text;
    }
    #panel .status:not(:empty) { margin-top: 9px; }
    #panel .status.is-error { color: #e08a7a; }

    /* The library. A <dialog>, so Escape closes it and the board behind stops
       taking clicks without any of that being written here. Its own surface is a
       shade lighter than the panels and it carries a shadow, because it is the
       one thing on screen that is *over* the world rather than beside it. */
    #levels {
      margin: auto;
      width: min(880px, calc(100vw - 32px));
      max-height: calc(100vh - 64px);
      padding: 0;
      border: 1px solid rgba(143, 216, 232, 0.18);
      border-radius: 10px;
      background: #101a2b;
      color: #b9cfe0;
      font-size: 12px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    #levels::backdrop { background: rgba(4, 8, 16, 0.62); }
    #levels .sheet { display: flex; flex-direction: column; max-height: calc(100vh - 64px); }

    #levels header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 15px 18px 13px;
      border-bottom: 1px solid rgba(143, 216, 232, 0.14);
    }
    #levels h2 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #f0dcc0;
    }
    #levels .hint { color: #6d8195; }

    /* Cards, and they wrap: a library of three is three across and a library of
       twenty scrolls, without either case needing a different layout. */
    #levels .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
      gap: 10px;
      padding: 14px 18px;
      overflow-y: auto;
    }
    #levels .empty { color: #6d8195; padding: 6px 0 10px; }

    #levels .card {
      padding: 11px 12px 9px;
      border-radius: 7px;
      background: rgba(143, 216, 232, 0.05);
      border: 1px solid rgba(143, 216, 232, 0.12);
    }
    /* The level on screen behind the modal, and it is said twice - a warm border
       and the word - because "which one am I in" is the question the library is
       opened with. */
    #levels .card.is-open {
      border-color: rgba(224, 160, 92, 0.45);
      background: rgba(224, 160, 92, 0.07);
    }
    #levels .card.is-broken { border-color: rgba(224, 138, 122, 0.35); }

    #levels .card .title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #dcecf6;
      font-size: 13px;
      line-height: 1.25;
      word-break: break-word;
    }
    #levels .card .badge {
      flex: none;
      font-size: 9.5px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #e0a05c;
      padding: 2px 5px;
      border-radius: 3px;
      background: rgba(224, 160, 92, 0.14);
    }
    #levels .card .meta { color: #6d8195; padding: 5px 0 9px; line-height: 1.35; }

    /* Five words on a card is a lot of buttons, so they are text rather than
       boxes - a row of chips would outweigh the name they belong to. */
    #levels .card .acts {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 4px;
      margin: 0 -5px;
    }
    #levels .card .acts button {
      font: inherit;
      color: #9fd8ee;
      background: none;
      border: 0;
      padding: 3px 5px;
      border-radius: 4px;
      cursor: pointer;
    }
    #levels .card .acts button:hover:not(:disabled) { background: rgba(143, 216, 232, 0.14); }
    #levels .card .acts button:disabled { color: #55697c; cursor: default; }
    #levels .card .acts [data-act=delete] { color: #d99184; }

    #levels footer {
      display: flex;
      gap: 8px;
      padding: 12px 18px 14px;
      border-top: 1px solid rgba(143, 216, 232, 0.14);
    }
    #levels footer button {
      font: inherit;
      color: #dcecf6;
      padding: 7px 12px;
      border-radius: 5px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
      cursor: pointer;
      transition: background 160ms ease;
    }
    #levels footer button:hover { background: rgba(143, 216, 232, 0.20); }
    #levels footer [data-act=new] { color: #f0dcc0; border-color: rgba(224, 160, 92, 0.35); }
    /* Close is pushed to the far end and given no fill: it is the way out, not
       one of the things to do in here. */
    #levels footer .is-plain {
      margin-left: auto;
      background: none;
      border-color: transparent;
      color: #8fa4b8;
    }

    #levels .status {
      color: #7f93a4;
      line-height: 1.4;
      padding: 0 18px 14px;
    }
    #levels .status:empty { display: none; }
    #levels .status.is-error { color: #e08a7a; }

    #controls {
      left: 16px; bottom: 16px;
      display: grid;
      grid-template-columns: auto auto;
      gap: 5px 12px;
      align-items: center;
      opacity: 0.4;
      transition: opacity 220ms ease;
    }
    #controls:hover { opacity: 1; }
    #controls kbd {
      justify-self: end;
      font: inherit;
      color: #dcecf6;
      white-space: nowrap;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="panel"></div>
  <dialog id="levels"></dialog>
  <div id="controls">
    <kbd>Left-click</kbd><span>Select a hex</span>
    <kbd>Right-drag</kbd><span>Rotate</span>
    <kbd>Middle-drag</kbd><span>Pan</span>
    <kbd>Wheel</kbd><span>Zoom</span>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
