<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hex Tactics - Editor</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

    /* Two panels in the same key as the game's corner legend - the editor is the
       same world with a different question asked of it, so it should not arrive
       in a different visual language. */
    #panel, #controls {
      position: fixed;
      padding: 11px 14px;
      border-radius: 7px;
      background: rgba(9, 16, 30, 0.55);
      border: 1px solid rgba(143, 216, 232, 0.14);
      color: #b9cfe0;
      font-size: 12px;
      line-height: 1;
      user-select: none;
      cursor: default;
    }

    /* Top right, and at full opacity: this one is a readout that is being read,
       not a reminder that fades out of the picture after the first minute. */
    #panel { right: 16px; top: 16px; min-width: 190px; }
    #panel .rows {
      display: grid;
      grid-template-columns: auto auto;
      gap: 5px 12px;
      align-items: center;
    }
    #panel .k { color: #7f93a4; }
    #panel .v { justify-self: end; color: #dcecf6; font-variant-numeric: tabular-nums; }

    /* A rule above the button: the rows are what the level *is* and the button
       is everything that can be done to it, which now lives behind the one
       word. */
    #panel .bar {
      display: flex;
      gap: 8px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid rgba(143, 216, 232, 0.14);
    }
    #panel button {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: #dcecf6;
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
      cursor: pointer;
      transition: background 160ms ease;
    }
    #panel button:hover:not(:disabled) { background: rgba(143, 216, 232, 0.20); }
    #panel button:disabled { opacity: 0.4; cursor: default; }
    /* Play is the one thing in this panel that leaves the editor, so it is the
       one warm control - the same warm the active tool and the open level card
       are, which is this UI's whole vocabulary for "this one is live". */
    #panel .is-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #f0dcc0;
      background: rgba(224, 160, 92, 0.14);
      border-color: rgba(224, 160, 92, 0.42);
    }
    #panel .is-primary:hover { background: rgba(224, 160, 92, 0.24); }
    #panel .is-primary kbd {
      font: inherit;
      font-size: 10px;
      color: #b9cfe0;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
    }
    /* One switch, under Play, because it is a fact about the playtest and not
       about the level. Most of what the editor is used to check is a question
       about a board you can see all of. */
    #panel .check {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 2px 0;
      color: #7f93a4;
      cursor: pointer;
    }
    #panel .check input { accent-color: #e0a05c; cursor: pointer; }
    #panel .check:hover { color: #b9cfe0; }

    /* The bar under it has no rule of its own - the two are one block. */
    #panel .bar + .bar { margin-top: 6px; padding-top: 0; border-top: 0; }

    /* Empty until something has happened, and it collapses when it is - a status
       line reserving space for a message nobody has been given yet is a gap in
       the panel. */
    #panel .status {
      color: #7f93a4;
      line-height: 1.4;
      max-width: 220px;
      user-select: text;
    }
    #panel .status:not(:empty) { margin-top: 9px; }
    #panel .status.is-error { color: #e08a7a; }

    /* The tool rail, down the left edge, and the permanent home for editing.
       Vertical because the list is going to grow - units, enemies, objects,
       pickups - and downward is the direction the viewport can spare; a
       horizontal strip of the same length would eat the board. */
    #tools {
      position: fixed;
      left: 16px; top: 16px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #b9cfe0;
      font-size: 12px;
      line-height: 1;
      user-select: none;
    }
    #tools .rail, #tools .settings {
      padding: 9px;
      border-radius: 7px;
      background: rgba(9, 16, 30, 0.55);
      border: 1px solid rgba(143, 216, 232, 0.14);
    }

    #tools .group + .group { margin-top: 10px; }
    /* The category, small and quiet. It is a heading over two or three icons and
       it is what makes the rail legible once there are four of them. */
    #tools .glabel {
      display: block;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6d8195;
      padding: 0 0 6px 2px;
    }
    #tools button.tool {
      display: grid;
      place-items: center;
      width: 34px; height: 34px;
      padding: 0;
      color: #9fd8ee;
      border-radius: 6px;
      background: rgba(143, 216, 232, 0.08);
      border: 1px solid rgba(143, 216, 232, 0.14);
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease;
    }
    #tools button.tool + button.tool { margin-top: 5px; }
    #tools button.tool svg { width: 18px; height: 18px; }
    #tools button.tool:hover { background: rgba(143, 216, 232, 0.18); }
    /* The active tool is warm, which is the one place in this UI that colour
       carries state: everything else here is the same cool blue, so the tool
       that is armed is the only warm thing on the left of the screen. */
    #tools button.tool.is-on {
      color: #f0dcc0;
      background: rgba(224, 160, 92, 0.16);
      border-color: rgba(224, 160, 92, 0.45);
    }

    /* The active tool's settings, in a card beside the rail rather than under it:
       the rail is a fixed column of icons and stays that width however many
       settings a tool turns out to have. */
    #tools .settings { min-width: 132px; }
    #tools .sname { color: #f0dcc0; padding-bottom: 8px; }
    #tools .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 3px 0;
    }
    #tools .slabel { color: #7f93a4; }
    #tools .stepper { display: flex; align-items: center; gap: 2px; }
    #tools .stepper b {
      min-width: 16px;
      text-align: center;
      color: #dcecf6;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    #tools .stepper button {
      width: 20px; height: 20px;
      padding: 0;
      font: inherit;
      color: #9fd8ee;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
      cursor: pointer;
    }
    #tools .stepper button:hover:not(:disabled) { background: rgba(143, 216, 232, 0.22); }
    #tools .stepper button:disabled { opacity: 0.3; cursor: default; }
    /* A choice out of grouped options: the category, then chips that wrap. The
       chips reuse the rail's warm-for-active, because it is the same statement -
       this is the one that is armed. */
    #tools .choice .glabel { padding: 7px 0 5px 1px; }
    #tools .choice .glabel:first-child { padding-top: 2px; }
    #tools .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    #tools .chips button {
      font: inherit;
      color: #9fd8ee;
      padding: 4px 7px;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.08);
      border: 1px solid rgba(143, 216, 232, 0.16);
      cursor: pointer;
      transition: background 140ms ease;
    }
    #tools .chips button:hover { background: rgba(143, 216, 232, 0.20); }
    #tools .chips button.is-on {
      color: #f0dcc0;
      background: rgba(224, 160, 92, 0.16);
      border-color: rgba(224, 160, 92, 0.45);
    }
    /* The two numbers the game reads off the chosen type. A readout, not a
       setting: they belong to the unit and the editor does not get a say. */
    #tools .snote {
      color: #7f93a4;
      padding-top: 8px;
      line-height: 1.4;
      max-width: 150px;
    }

    /* What the tool does, in one line. It is the only prose in the editor and it
       is here because a rail of icons needs somewhere to say what the icon meant. */
    #tools .shint {
      color: #6d8195;
      line-height: 1.4;
      padding-top: 7px;
      max-width: 150px;
    }

    /* The library. A <dialog>, so Escape closes it and the board behind stops
       taking clicks without any of that being written here. Its own surface is a
       shade lighter than the panels and it carries a shadow, because it is the
       one thing on screen that is *over* the world rather than beside it. */
    #levels {
      margin: auto;
      width: min(880px, calc(100vw - 32px));
      max-height: calc(100vh - 64px);
      padding: 0;
      border: 1px solid rgba(143, 216, 232, 0.18);
      border-radius: 10px;
      background: #101a2b;
      color: #b9cfe0;
      font-size: 12px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    #levels::backdrop { background: rgba(4, 8, 16, 0.62); }
    #levels .sheet { display: flex; flex-direction: column; max-height: calc(100vh - 64px); }

    #levels header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 15px 18px 13px;
      border-bottom: 1px solid rgba(143, 216, 232, 0.14);
    }
    #levels h2 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #f0dcc0;
    }
    #levels .hint { color: #6d8195; }

    /* Cards, and they wrap: a library of three is three across and a library of
       twenty scrolls, without either case needing a different layout. */
    #levels .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
      gap: 10px;
      padding: 14px 18px;
      overflow-y: auto;
    }
    #levels .empty { color: #6d8195; padding: 6px 0 10px; }

    #levels .card {
      padding: 11px 12px 9px;
      border-radius: 7px;
      background: rgba(143, 216, 232, 0.05);
      border: 1px solid rgba(143, 216, 232, 0.12);
    }
    /* The level on screen behind the modal, and it is said twice - a warm border
       and the word - because "which one am I in" is the question the library is
       opened with. */
    #levels .card.is-open {
      border-color: rgba(224, 160, 92, 0.45);
      background: rgba(224, 160, 92, 0.07);
    }
    #levels .card.is-broken { border-color: rgba(224, 138, 122, 0.35); }

    /* The board, and it sits in a slightly sunken well rather than on the card:
       a plan view with no lighting in it needs an edge to read as a picture, and
       a darker ground is also what the sea and the unlit grass look right
       against. */
    #levels .card .shot {
      display: block;
      /* Nearly square, because a hex board nearly is. A wide letterbox fits a
         round island by its height and leaves a third of the card empty either
         side, which makes the picture small for no reason. */
      aspect-ratio: 4 / 3;
      margin-bottom: 9px;
      border-radius: 5px;
      background: #0b1220;
      border: 1px solid rgba(143, 216, 232, 0.09);
      overflow: hidden;
    }
    #levels .card .shot svg { display: block; width: 100%; height: 100%; }

    #levels .card .title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #dcecf6;
      font-size: 13px;
      line-height: 1.25;
      word-break: break-word;
    }
    #levels .card .badge {
      flex: none;
      font-size: 9.5px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #e0a05c;
      padding: 2px 5px;
      border-radius: 3px;
      background: rgba(224, 160, 92, 0.14);
    }
    #levels .card .meta { color: #6d8195; padding: 5px 0 9px; line-height: 1.35; }

    /* Five words on a card is a lot of buttons, so they are text rather than
       boxes - a row of chips would outweigh the name they belong to. */
    #levels .card .acts {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 4px;
      margin: 0 -5px;
    }
    #levels .card .acts button {
      font: inherit;
      color: #9fd8ee;
      background: none;
      border: 0;
      padding: 3px 5px;
      border-radius: 4px;
      cursor: pointer;
    }
    #levels .card .acts button:hover:not(:disabled) { background: rgba(143, 216, 232, 0.14); }
    #levels .card .acts button:disabled { color: #55697c; cursor: default; }
    #levels .card .acts [data-act=delete] { color: #d99184; }

    #levels footer {
      display: flex;
      gap: 8px;
      padding: 12px 18px 14px;
      border-top: 1px solid rgba(143, 216, 232, 0.14);
    }
    #levels footer button {
      font: inherit;
      color: #dcecf6;
      padding: 7px 12px;
      border-radius: 5px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
      cursor: pointer;
      transition: background 160ms ease;
    }
    #levels footer button:hover { background: rgba(143, 216, 232, 0.20); }
    #levels footer [data-act=new] { color: #f0dcc0; border-color: rgba(224, 160, 92, 0.35); }
    /* Close is pushed to the far end and given no fill: it is the way out, not
       one of the things to do in here. */
    #levels footer .is-plain {
      margin-left: auto;
      background: none;
      border-color: transparent;
      color: #8fa4b8;
    }

    #levels .status {
      color: #7f93a4;
      line-height: 1.4;
      padding: 0 18px 14px;
    }
    #levels .status:empty { display: none; }
    #levels .status.is-error { color: #e08a7a; }

    #controls {
      left: 16px; bottom: 16px;
      display: grid;
      grid-template-columns: auto auto;
      gap: 5px 12px;
      align-items: center;
      opacity: 0.4;
      transition: opacity 220ms ease;
    }
    #controls:hover { opacity: 1; }
    #controls kbd {
      justify-self: end;
      font: inherit;
      color: #dcecf6;
      white-space: nowrap;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(143, 216, 232, 0.10);
      border: 1px solid rgba(143, 216, 232, 0.18);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="tools"></div>
  <div id="panel"></div>
  <dialog id="levels"></dialog>
  <div id="controls">
    <kbd>Left-drag</kbd><span>Use the tool</span>
    <kbd>Wheel</kbd><span>Sculpt or zoom</span>
    <kbd>Right-drag</kbd><span>Rotate</span>
    <kbd>Middle-drag</kbd><span>Pan</span>
    <kbd>P</kbd><span>Play this level</span>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
